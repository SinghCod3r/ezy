[project]
name = "ezy-lang"
version = "0.1.0"
description = "Ezy: a readable, deterministic scripting language for automation, files, processes, HTTP and JSON."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
ezy = "ezy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
